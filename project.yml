name: Voiced
options:
  bundleIdPrefix: net.applification
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: 0.1.7
    SWIFT_VERSION: 6.0
configs:
  Debug: debug
  Release: release
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
targets:
  Voiced:
    type: application
    platform: macOS
    sources:
      - path: Voiced
      - path: Config/Assets.xcassets
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.applification.voiced
        PRODUCT_NAME: Voiced
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Voiced.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Voiced.entitlements
    scheme:
      testTargets:
        - VoicedTests
  VoicedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VoicedTests
    dependencies:
      - target: Voiced
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.applification.voiced.tests
        GENERATE_INFOPLIST_FILE: YES
