name: Voiced
options:
  bundleIdPrefix: net.applification
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.1.6
    SWIFT_VERSION: 6.0
    POSTHOG_PROJECT_TOKEN: ""
    POSTHOG_HOST: "https://eu.i.posthog.com"
  configs:
    AppStore:
      CODE_SIGN_ENTITLEMENTS: Config/Voiced-AppStore.entitlements
configs:
  Debug: debug
  Release: release
  AppStore: release
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.0
targets:
  Voiced:
    type: application
    platform: macOS
    sources:
      - path: Voiced
      - path: Config/Assets.xcassets
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: PostHog
        product: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.applification.voiced
        PRODUCT_NAME: Voiced
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Voiced.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Voiced.entitlements
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Config/Voiced-AppStore.entitlements
    scheme:
      testTargets: []
